# Supabase Free pauses a project after ~7 days without requests.
# This reads the public client data every 3 days so the database stays awake.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read published tours
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: sb_publishable_ExMkWaW-EznaJiSBwhftIg_YWjkbazU" \
            "https://zeabsedufqarfguoiyqr.supabase.co/rest/v1/published?select=id&limit=1")
          echo "Supabase answered $status"
          test "$status" = "200"
