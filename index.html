<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalkulator wycieczek</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}

/* layout: road-atlas sheet — editor column + sticky price ticket; public view = route strip + day list */
:root{
  --bg:#F2F4EF; --panel:#FFFFFF; --sunk:#E7EBE3; --line:#D3D9CE; --fg:#18231D; --muted:#5B6A60;
  --accent:#0E6B47; --accent-ink:#FFFFFF; --road:#D89A2B; --danger:#B3361F;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111814; --panel:#18211C; --sunk:#0D130F; --line:#2B3830; --fg:#E4EBE5; --muted:#93A399;
  --accent:#3FBF86; --accent-ink:#06150D; --road:#E8B04A; --danger:#F07A60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --panel:#18211C; --sunk:#0D130F; --line:#2B3830; --fg:#E4EBE5; --muted:#93A399;
  --accent:#3FBF86; --accent-ink:#06150D; --road:#E8B04A; --danger:#F07A60; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
#root{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;text-wrap:balance;margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-ghost{background:none;border-color:transparent;color:var(--muted);padding:4px 8px}
.btn-ghost:hover{color:var(--danger);border-color:transparent}
.btn-add{background:none;border-style:dashed;color:var(--accent);font-weight:500}
input,select,textarea{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:120px;font-size:14px}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{font-weight:500}

/* ---------- agent ---------- */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:26px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted)}
.status.dirty{color:var(--road);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.ticket{position:static!important;order:-1}}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.sec>h2{font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.row{display:grid;gap:8px;align-items:end;padding:10px;border-radius:9px;background:var(--sunk)}
.row input,.row select{background:var(--panel)}
.row .cost{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap;padding-bottom:7px}
.r-staff{grid-template-columns:minmax(120px,2fr) 1fr 1fr 70px 70px auto auto}
.r-leg{grid-template-columns:130px minmax(120px,2fr) repeat(5,minmax(70px,1fr)) auto auto}
.r-leg.flat{grid-template-columns:130px minmax(120px,2fr) 1fr 120px auto auto}
.r-item{grid-template-columns:minmax(140px,2fr) 1fr 120px auto auto}
@media (max-width:700px){.row{grid-template-columns:1fr 1fr!important}.row .wide{grid-column:1/-1}.row .cost{text-align:left}}
details.day{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px}
details.day>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.day>summary::-webkit-details-marker{display:none}
.daynum{font-family:var(--f-display);font-weight:800;font-size:15px;min-width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.dayhead{flex:1;min-width:0}
.dayhead b{display:block;font-family:var(--f-display);font-size:16px;overflow-wrap:anywhere}
.daybody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.sub{display:flex;flex-direction:column;gap:8px}
.sub>h3{font-family:var(--f-body);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dayacts{display:flex;gap:6px;flex-wrap:wrap}
.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket .head{background:var(--accent);color:var(--accent-ink);padding:16px}
.ticket .head .big{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1}
.ticket .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-top:2px dashed var(--line)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv.sum{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.tiers{width:100%;border-collapse:collapse;font-size:13px}
.tiers td{padding:3px 0;border-bottom:1px solid var(--line)}
.tiers td:last-child{text-align:right}
.tiers tr.cur td{color:var(--accent);font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto}
.preview-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--road);color:#1d1503;padding:10px 14px;border-radius:10px;margin-bottom:18px;font-weight:600}
.preview-bar button{background:#fff8e6;color:#1d1503;border-color:transparent}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}

/* ---------- public ---------- */
.pub{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding-top:8px}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(28px,5vw,44px)}
.hero p{max-width:60ch;margin:10px 0 0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;background:var(--panel)}
.pricecard{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 20px;min-width:220px}
.pricecard .big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.route{overflow-x:auto;padding-bottom:4px}
.route ol{list-style:none;margin:0;padding:0;display:flex;min-width:max-content}
.route li{position:relative;padding:22px 18px 0 0;font-weight:600;font-size:14px;white-space:nowrap}
.route li::before{content:"";position:absolute;left:0;right:0;top:8px;height:4px;background:var(--road);border-radius:2px}
.route li:last-child::before{right:auto;width:12px}
.route li::after{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--accent)}
.pday{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.pday h3{font-size:20px}
.pday .meta{font-size:13px;color:var(--muted);margin-top:4px}
.prog{margin-top:10px;font-size:15px}
.prog p{margin:6px 0}
.prog ul{margin:4px 0 8px;padding-left:20px}
.inc{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 20px;margin:0;padding:0;list-style:none}
.inc li{padding-left:22px;position:relative}
.inc li::before{content:"";position:absolute;left:2px;top:7px;width:10px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.box h2{font-size:20px;margin-bottom:10px}
.empty{text-align:center;padding:60px 16px}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{border:0;border-radius:0;padding:6px 10px;font-size:13px;font-weight:600;background:var(--panel);color:var(--muted)}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.linkbtn{display:inline-flex;align-items:center;padding:7px 12px;border-radius:8px;border:1px solid var(--line);color:var(--fg);text-decoration:none;background:var(--panel)}
.linkbtn:hover{border-color:var(--accent)}
.login{max-width:560px;margin:40px auto;display:flex;flex-direction:column;gap:10px}
.login h1{font-size:22px;line-height:1.3}
.login a{color:var(--accent);font-weight:600}
.login-form{display:flex;flex-direction:column;gap:12px}
.login-form .btn-main{padding:10px 14px}
.tripgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tripcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tripcard h2{font-size:19px;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--muted)}
.st-live .pill{background:var(--accent);color:var(--accent-ink)}
.st-changed .pill,.st-removing .pill{background:var(--road);color:#1d1503}
.tourlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tourcard{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);text-decoration:none}
.tourcard:hover{border-color:var(--accent)}
.tourcard h2{font-size:21px}
.tourfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.backlink{margin-right:auto;color:var(--accent);font-weight:600;text-decoration:none;align-self:center}
.pubbar{display:flex;justify-content:flex-end;max-width:820px;margin:0 auto 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
